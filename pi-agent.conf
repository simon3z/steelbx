image = "bytenix.com/pi-coding-agent:44"

extra_hosts = [
  "llm.in1.bytenix.com:host-gateway",
]

user = "$USER"
userns = "keep-id"
workdir = "/workspace"
# security_opts = ["label=disable"]

# Overlay on $HOME: podman's --mount has no `type=overlay` (and the
# `:O` flag only works with -v/--volume), so bind the three dirs in and
# mount the overlay inside the box in `init` below.
mounts = [
  "type=bind,src=$STEELBX_HOME,dst=/run/lower,ro",
  "type=bind,src=$STEELBX_HOME-upper,dst=/run/upper",
  "type=bind,src=$STEELBX_HOME-work,dst=/run/work",
# "type=bind,source=$HOME/steelbx-pi,destination=/run/home-template,ro",
# "type=volume,src=$HOME/steelbx-pi,dst=$HOME",
# "type=bind,source=${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY},destination=${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}",
# "type=bind,source=${XDG_RUNTIME_DIR},destination=${XDG_RUNTIME_DIR}",
]

init = [
  ["exec", "mount", "-t", "overlay", "-o", "lowerdir=/run/lower,upperdir=/run/upper,workdir=/run/work", "/home/$USER"],
  ["exec", "usermod", "-G", "wheel", "-d", "$HOME", "-p", "", "$USER"],
# ["exec", "cp", "-a", "/run/home-template/.", "$HOME"],
]

#env_files = [
#  "/etc/os-release",
#]

runtime_env = [
  "USER",
  "COLORTERM",
  "LANG",
  "TERM",
]

[env]
STEELBX_HOME = "${STEELBX_HOME:-$HOME/steelbx-pi}"

#XDG_RUNTIME_DIR = "$XDG_RUNTIME_DIR"
#WAYLAND_DISPLAY = "${WAYLAND_DISPLAY:-wayland-0}"
