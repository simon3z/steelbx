# ~/.config/steelbx/profiles/toolbox.conf
#
# A toolbox-style box: shared namespaces, host access, a mapped user.
# This replicates what `toolbox` gives you — a root-adjacent
# environment, not a sandbox. The same schema can express more
# secure (isolated) boxes too.
#
# Install: copy this file to
#   ~/.config/steelbx/profiles/toolbox.conf
# then:  steelbx create toolbox <paths...>

# ─────────────────────────────────────────────────────────────
# REQUIRED
# ─────────────────────────────────────────────────────────────

image = "registry.fedoraproject.org/fedora-toolbox:latest"

# ─────────────────────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────────────────────

# Toolbox is root-adjacent: namespaces shared with the host,
# keep-id maps your uid in.
userns = "keep-id"
user = "$USER"
workdir = "$HOME"

# ─────────────────────────────────────────────────────────────
# NETWORKING
# ─────────────────────────────────────────────────────────────

# Host networking: the box shares the host's network stack.
network = "host"

# ─────────────────────────────────────────────────────────────
# NAMESPACE SHARING
# ─────────────────────────────────────────────────────────────

# All shared with the host (toolbox behavior).
pid = "host"
ipc = "host"
cgroupns = "host"

# ─────────────────────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────────────────────

# Privileged + label=disable: the box has full host access.
# This is the point of a toolbox — not a sandbox.
privileged = true
no_hosts = true
ulimits = ["host"]
security_opts = ["label=disable"]

# ─────────────────────────────────────────────────────────────
# FILESYSTEM
# ─────────────────────────────────────────────────────────────

# Keep only the sockets/dirs your host actually has.
mounts = [
  "type=devpts,destination=/dev/pts",
  "type=bind,source=/,destination=/run/host",
  "type=bind,source=/dev,destination=/dev",
  "type=bind,source=$XDG_RUNTIME_DIR,destination=$XDG_RUNTIME_DIR",
  "type=bind,source=$HOME,destination=$HOME",
]

# ─────────────────────────────────────────────────────────────
# COMMAND & INITIALIZATION
# ─────────────────────────────────────────────────────────────

# Runs as root before the shell starts: map the host user in
# (home dir, wheel group, login shell).
init = [
  ["exec", "usermod", "-p", "", "-G", "wheel", "-d", "$HOME", "-s", "${SHELL:-/bin/bash}", "$USER"],
]

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────

# Only these are passed to the container.
[env]
XDG_RUNTIME_DIR = "$XDG_RUNTIME_DIR"
TOOLBOX_PATH = "/dev/null"
