# ~/.config/steelbx/profiles/pi-agent.conf
#
# A toolbox-style box for an AI coding agent (pi, Claude Code, Codex,
# OpenCode, ...): the same identity and session access as the host
# user, with the box's home backed by a dedicated host directory.
#
# Security model (what this opens, and the trade):
#   - keep-id + label=disable: the box works on SELinux hosts, in
#     exchange for the box's SELinux confinement.
#   - Wayland socket bind + session env: the box can render into your
#     live session (GUI works), and receive input aimed at its own
#     windows. This is the widest surface.
#   - Network: podman's default (full outbound). The workload needs
#     it to reach external APIs.
#   - No pid/ipc/cgroupns sharing: those stay private.

# ─────────────────────────────────────────────────────────────
# REQUIRED
# ─────────────────────────────────────────────────────────────

image = "localhost/pi-steelbx"

# ─────────────────────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────────────────────

# keep-id: processes in the box are never host root; files the box
# writes into bind mounts come out owned by you.
userns = "keep-id"
user = "$USER"
workdir = "$HOME"

# label=disable: required because keep-id plus binds of host-owned
# directories don't cross the svirt label boundary.
security_opts = ["label=disable"]

# ─────────────────────────────────────────────────────────────
# FILESYSTEM
# ─────────────────────────────────────────────────────────────

# The box's home is a *dedicated* host directory, bound as the in-box
# $HOME — not your real home. The Wayland socket is bound at the same
# path (lets the box render into your live session).
mounts = [
  "type=bind,source=$HOME/steelbx-pi,destination=$HOME",
  "type=bind,source=${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY},destination=${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}",
]

# ─────────────────────────────────────────────────────────────
# COMMAND & INITIALIZATION
# ─────────────────────────────────────────────────────────────

# Runs as container root (mapped, no host privileges): grants wheel
# (sudo in-box), sets the home to match the bind, clears the password.
init = [
  ["exec", "usermod", "-G", "wheel", "-d", "$HOME", "-p", "", "$USER"],
]

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────

# Runtime env: terminal/locale passthrough, session identity, and the
# agent's API keys. Copied from your shell at enter/exec; unset names
# are skipped with an info line.
runtime_env = [
  "TERM",
  "COLORTERM",
  "LANG",
  "EDITOR",
  "SHELL",
  "USER",
  "OPENROUTER_API_KEY",
  "OPENROUTER_MODEL",
]

# Box env: mount-fixed session vars — must match the mount paths
# above, so baked at create (not copied live).
[env]
XDG_RUNTIME_DIR = "$XDG_RUNTIME_DIR"
WAYLAND_DISPLAY = "$WAYLAND_DISPLAY"
