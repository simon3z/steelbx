# ~/.config/steelbx/profiles/default.conf
#
# The minimal, most-secure default posture. Copy this file to
#   ~/.config/steelbx/profiles/default.conf
# to use it.
#
# Security model (what this gives you):
#   - keep-id userns: the box runs in a user namespace; processes
#     inside are never host root.
#   - network = none: the box has no network.
#   - No mounts: the box's filesystem is its own.
#   - No runtime_env: no secrets from your shell leak into sessions.
#   - No security_opts: SELinux (or your host LSM) stays on.
#
# This file is also the full schema reference: every key a profile
# can carry is shown below, with the secure default active and the
# rest commented out. Uncomment and adjust to opt into more.

# ─────────────────────────────────────────────────────────────
# REQUIRED
# ─────────────────────────────────────────────────────────────

# The box image (must be local — steelbx consumes, does not pull).
# Override for one create with `steelbx create -i <image> ...`.
image = "registry.fedoraproject.org/fedora-minimal:latest"

# ─────────────────────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────────────────────

# User namespace: "keep-id" maps your uid/gid in (box processes are
# never host root); "host" shares the host userns (no isolation).
userns = "keep-id"

# Run as this user inside the box (expanded: $USER is your host name).
# Absent = the image's declared USER (often root).
user = "$USER"

# Container working directory (also the base where CLI path mounts
# land as <workdir>/<basename>). Absent = the image's WORKDIR or /work.
# workdir = "$HOME"

# ─────────────────────────────────────────────────────────────
# NETWORKING
# ─────────────────────────────────────────────────────────────

# "none" disables all networking. "bridge" (podman default) or
# "pasta" give outbound. "host" shares the host netns (no isolation).
network = "none"

# Extra /etc/hosts entries: "name:ip" pairs.
# extra_hosts = ["myhost:10.0.0.1"]

# ─────────────────────────────────────────────────────────────
# NAMESPACE SHARING (omit for podman's default: private)
# ─────────────────────────────────────────────────────────────

# "host" shares the host namespace; "private" is isolated.
# cgroupns = "private"
# ipc = "private"
# pid = "private"

# ─────────────────────────────────────────────────────────────
# FILESYSTEM
# ─────────────────────────────────────────────────────────────

# Podman --mount specs, verbatim. Shape-checked (no spaces).
# Add to opt into host surfaces:
#   "type=bind,source=$HOME/steelbx,destination=$HOME"
#   "type=devpts,destination=/dev/pts"
#   "type=bind,source=$XDG_RUNTIME_DIR,destination=$XDG_RUNTIME_DIR"
# mounts = []

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT
# ─────────────────────────────────────────────────────────────

# Box env: baked at create (podman --env KEY=VALUE). This is the ONLY
# env the container sees. Values expand against the caller env and
# env_files below. Same-key wins over the image's baked-in ENV.
# [env]
# FOO = "bar"

# Expansion source files (NOT passed to the container): KEY=VALUE
# lines parsed for variable expansion. Later files override earlier.
# Supports # comments and a leading "export ".
# env_files = ["/etc/os-release"]

# Runtime env: NAMES only (not values) copied from your shell into
# each enter/exec session (podman exec -e NAME). The value is never
# on argv. Unset names are skipped with an info line.
# Use this for terminal passthrough and API keys:
# runtime_env = ["TERM", "COLORTERM", "LANG", "EDITOR", "SHELL"]

# ─────────────────────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────────────────────

# Podman --security-opt entries (e.g. "label=disable" turns SELinux
# off for this box). Absent = podman's default (SELinux on).
# security_opts = ["label=disable"]

# ─────────────────────────────────────────────────────────────
# LIMITS & PRIVILEGE
# ─────────────────────────────────────────────────────────────

# Ulimit entries: "host", "nofile=65535:65535", etc.
# ulimits = []

# Full privilege: bypasses most restrictions. Avoid unless needed.
# privileged = true

# Keep the image's /etc/hosts (don't generate a container one).
# no_hosts = true

# ─────────────────────────────────────────────────────────────
# COMMAND & INITIALIZATION
# ─────────────────────────────────────────────────────────────

# The main command argv (replaces the heartbeat default). Absent =
# the image's declared command (if it carries the steelbx label),
# else the heartbeat (the box idles until you enter).
# entry = ["/usr/bin/python", "-u"]

# Post-create init steps: run before the box is handed over.
# Each step is one of:
#   ["exec", "cmd", "arg1", "arg2", ...]  — run as container root
#   ["cp", "/host/path", "/container/path"]  — copy a file
# init = [
#   ["exec", "usermod", "-G", "wheel", "-d", "$HOME", "-p", "", "$USER"],
# ]
